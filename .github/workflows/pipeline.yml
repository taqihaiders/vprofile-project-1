name: Docker Build and Push to ECR

on:
  push:
    branches:
      - docker  # Trigger the pipeline on pushing to the 'docker' branch

jobs:
  # Job 1: Build and Push Backend (Frontend) Docker Image
  build-backend:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up AWS credentials
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 650576187890.dkr.ecr.us-east-1.amazonaws.com

      # Step 4: Set image name and repository for frontend (app)
      - name: Set image name for frontend (app)
        run: |
          FRONTEND_REPO=vpro-fe  # Frontend ECR repository
          FRONTEND_IMAGE_NAME=650576187890.dkr.ecr.us-east-1.amazonaws.com/$FRONTEND_REPO:latest
          echo "FRONTEND_IMAGE_NAME=${FRONTEND_IMAGE_NAME}" >> $GITHUB_ENV

      # Step 5: Build the frontend Docker image
      - name: Build frontend Docker image
        run: |
          docker build -f Docker-files/app -t $FRONTEND_IMAGE_NAME .

      # Step 6: Push the frontend image to Amazon ECR
      - name: Push frontend Docker image to ECR
        run: |
          docker push $FRONTEND_IMAGE_NAME

  # Job 2: Build and Push Database Docker Image
  build-database:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up AWS credentials
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 650576187890.dkr.ecr.us-east-1.amazonaws.com

      # Step 4: Set image name and repository for database (db)
      - name: Set image name for database (db)
        run: |
          DB_REPO=vpro-db  # Database ECR repository
          DB_IMAGE_NAME=650576187890.dkr.ecr.us-east-1.amazonaws.com/$DB_REPO:latest
          echo "DB_IMAGE_NAME=${DB_IMAGE_NAME}" >> $GITHUB_ENV

      # Step 5: Build the database Docker image
      - name: Build database Docker image
        run: |
          docker build -f Docker-files/db -t $DB_IMAGE_NAME .

      # Step 6: Push the database image to Amazon ECR
      - name: Push database Docker image to ECR
        run: |
          docker push $DB_IMAGE_NAME
