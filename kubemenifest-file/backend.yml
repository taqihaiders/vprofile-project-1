apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: default
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: app-service-account
      containers:
      - name: backend
        image: 650576187890.dkr.ecr.us-east-1.amazonaws.com/vpro-fe:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
        # Database Configuration
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        # Memcached Configuration
        - name: MEMCACHED_ACTIVE_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MEMCACHED_ACTIVE_HOST
        - name: MEMCACHED_ACTIVE_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MEMCACHED_ACTIVE_PORT
        - name: MEMCACHED_STANDBY_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MEMCACHED_STANDBY_HOST
        - name: MEMCACHED_STANDBY_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MEMCACHED_STANDBY_PORT
        # RabbitMQ Configuration
        - name: RABBITMQ_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_PORT
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_USERNAME
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: RABBITMQ_PASSWORD
        # Elasticsearch Configuration
        - name: ELASTICSEARCH_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ELASTICSEARCH_PORT
        - name: ELASTICSEARCH_CLUSTER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ELASTICSEARCH_CLUSTER
        - name: ELASTICSEARCH_NODE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ELASTICSEARCH_NODE
        # Spring Security Configuration
        - name: SPRING_SECURITY_USER_NAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_SECURITY_USER_NAME
        - name: SPRING_SECURITY_USER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_SECURITY_USER_PASSWORD
        - name: SPRING_SECURITY_USER_ROLES
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SPRING_SECURITY_USER_ROLES
        # Application Configuration
        - name: MAX_FILE_SIZE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MAX_FILE_SIZE
        - name: MAX_REQUEST_SIZE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MAX_REQUEST_SIZE
        # Logging Configuration
        - name: LOGGING_LEVEL_ROOT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: LOGGING_LEVEL_ROOT
        - name: LOGGING_LEVEL_SECURITY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: LOGGING_LEVEL_SECURITY
        - name: LOGGING_LEVEL_HIBERNATE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: LOGGING_LEVEL_HIBERNATE
        volumeMounts:
        - name: secrets-store
          mountPath: "/mnt/secrets"
          readOnly: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: external-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: NodePort
